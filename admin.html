Projects:()=>`<form class="cd" id="pf"><div class="g"><input name="title" placeholder="Project title" required><select name="cat"><option>Residential</option><option>Commercial</option><option>Hospitality</option><option>Renovation</option></select><input name="meta" placeholder="Price or area (e.g. 2400 sq ft)"><input name="loc" placeholder="Location"><textarea name="desc" class="f" rows="3" placeholder="Project details"></textarea><label class="f">Project picture <input type="file" name="img" accept="image/*" required></label></div><button class="bt">Add project</button></form>${P.map(p=>`<div class="cd"><div class="r"><span style="display:flex;gap:12px;align-items:center">${p.img?`<img src="${p.img}" style="width:70px;height:50px;object-fit:cover">`:""}<b>${esc(p.title)}</b><small>${esc(p.cat)} · ${esc(p.meta)}</small></span><button class="bt dg" data-a="dp" data-id="${p.id}">Delete</button></div></div>`).join("")}`,
Backgrounds:()=>`<form class="cd" id="hf"><label>Add home page background pictures (select many)<input type="file" name="img" accept="image/*" multiple required></label><br><button class="bt">Upload</button></form><div class="th">${H.map(h=>`<div><img src="${h.img}" alt=""><button data-a="dh" data-id="${h.id}">✕</button></div>`).join("")||"<p>No pictures yet. Default scenes are showing.</p>"}</div>`,
Contacts:()=>`<form class="cd" id="cof"><div class="g">${[["whatsapp","WhatsApp link"],["messenger","Messenger link"],["instagram","Instagram link"],["phone","Call number"],["email","Email"],["address","Address"]].map(f=>`<label>${f[1]}<input name="${f[0]}" value="${esc(C[f[0]])}"></label>`).join("")}</div><button class="bt">Save contacts</button></form>`,
Content:()=>`<form class="cd" id="tf"><div class="g"><input name="n" placeholder="Client name" required><select name="s"><option>5</option><option>4</option><option>3</option></select><textarea name="t" class="f" rows="2" placeholder="Review text" required></textarea></div><button class="bt">Add review</button></form>${(C.tests||[]).map((t,i)=>`<div class="cd"><div class="r"><span><b>${esc(t.n)}</b><br>${esc(t.t)}</span><button class="bt dg" data-a="dt" data-id="${i}">Delete</button></div></div>`).join("")}`,
Account:()=>`<p style="margin-bottom:12px">Signed in as <b>${esc(au.currentUser?.email||"")}</b></p><form class="cd" id="pwf"><h3 style="font:500 16px Inter;margin-bottom:10px">Change password</h3><div class="g"><input name="cur" type="password" placeholder="Current password" required class="f"><input name="n1" type="password" placeholder="New password (min 8)" minlength="8" required><input name="n2" type="password" placeholder="Repeat new password" minlength="8" required></div><button class="bt">Update password</button></form><form class="cd" id="emf"><h3 style="font:500 16px Inter;margin-bottom:10px">Change login email</h3><div class="g"><input name="cur" type="password" placeholder="Current password" required class="f"><input name="ne" type="email" placeholder="New email" required class="f"></div><button class="bt">Send verification to new email</button><p style="margin-top:8px"><small>Open the link sent to the new email. After that, log in with the new email.</small></p></form>`,
Settings:()=>`<form class="cd" id="sf"><div class="g"><label class="f">Brand name<input name="brand" value="${esc(C.brand)}"></label><label>Home title line 1<input name="h1" value="${esc(C.h1)}"></label><label>Home title line 2<input name="h2" value="${esc(C.h2)}"></label><label class="f">Home description<textarea name="sub" rows="3">${esc(C.sub)}</textarea></label><label>Slide time (seconds)<input name="interval" type="number" min="3" max="15" step=".5" value="${C.interval}"></label><div class="f"><button type="button" class="bt" data-a="pw">Change password (email link)</button><br><small>A reset link is sent to ${esc(au.currentUser?.email||"")}</small></div><label class="f"><input type="checkbox" name="loader" ${C.loader!==false?"checked":""} style="width:auto"> Show opening animation</label><label>Accent colour<input name="accent" type="color" value="${C.accent||"#8a6d4a"}"></label><label class="f">Search (SEO) description<input name="seo" value="${esc(C.seo||"")}"></label><label class="f"><input type="checkbox" name="showJournal" ${C.showJournal!==false?"checked":""} style="width:auto"> Show journal section</label><label class="f"><input type="checkbox" name="showTests" ${C.showTests!==false?"checked":""} style="width:auto"> Show client reviews</label></div><button class="bt">Save settings</button></form>`};
 $("#ad").innerHTML=`<div class="ad"><aside><b>${esc(C.brand)}</b>${TABS.map(t=>`<button class="${t===tab?"on":""}" data-t="${t}">${t}</button>`).join("")}<button data-t="x" style="margin-top:20px">View website</button><button data-t="out">Log out</button></aside><main><h2>${tab}</h2>${T[tab]()}</main></div>`}
$("#ad").addEventListener("click",async e=>{const b=e.target.closest("[data-t],[data-a]");if(!b)return;const t=b.dataset.t,a=b.dataset.a,id=b.dataset.id;
 if(t){if(t==="out"){await signOut(au);return closeAd()}if(t==="x")return closeAd();tab=t;return drawAd()}
 if(a==="pw"){try{const em=au.currentUser.email;await sendPasswordResetEmail(au,em);alert("Password reset email sent to "+em)}catch(e){alert("Could not send")}}
 if(a==="read"){const m=MS.find(x=>x.id===id);m.read=true;await put("messages",m)}
 if(a==="dm"&&confirm("Delete message?")){await del("messages",id);MS=MS.filter(x=>x.id!==id)}
 if(a==="do"&&confirm("Delete inquiry?")){await del("orders",id);OR=OR.filter(x=>x.id!==id)}
 if(a==="dp"&&confirm("Delete project?")){await del("projects",id);P=P.filter(x=>x.id!==id);render()}
 if(a==="dh"){await del("hero",id);H=H.filter(x=>x.id!==id);render()}
 if(a==="dt"){C.tests.splice(+id,1);await put("cfg",C);render()}
 drawAd()});
$("#ad").addEventListener("change",async e=>{const s=e.target.closest("[data-a=st]");if(!s)return;const o=OR.find(x=>x.id===s.dataset.id);o.status=s.value;await put("orders",o)});
$("#ad").addEventListener("submit",async e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f).entries());
 if(f.id==="lg"){try{await signInWithEmailAndPassword(au,d.e,d.p);if(!(await isAdm())){await signOut(au);throw 0}await loadAdmin()}catch(x){loginUI("Wrong email or password")}return}
 if(f.id==="pwf"){if(d.n1!==d.n2){alert("New passwords do not match");return}try{await reauthenticateWithCredential(au.currentUser,EmailAuthProvider.credential(au.currentUser.email,d.cur));await updatePassword(au.currentUser,d.n1);alert("Password changed");f.reset()}catch(x){alert("Could not change. Check your current password.")}return}
 if(f.id==="emf"){try{await reauthenticateWithCredential(au.currentUser,EmailAuthProvider.credential(au.currentUser.email,d.cur));await verifyBeforeUpdateEmail(au.currentUser,d.ne);alert("Verification link sent to "+d.ne+". Open it, then log in with the new email.")}catch(x){alert("Could not change. Check your current password and the new email.")}return}
 if(f.id==="pf"){const img=await shrink(f.img.files[0]);const p={id:uid(),title:d.title,cat:d.cat,meta:d.meta,loc:d.loc,desc:d.desc,img,ts:Date.now()};if(await put("projects",p)){P.unshift(p);render()}}
 if(f.id==="hf"){for(const fl of f.img.files){const h={id:uid(),img:await shrink(fl,1600,.6),ts:Date.now()};if(await put("hero",h))H.push(h)}render()}
 if(f.id==="cof"){Object.assign(C,d);await put("cfg",C);render()}
 if(f.id==="tf"){(C.tests=C.tests||[]).push({n:d.n,t:d.t,s:+d.s});await put("cfg",C);render()}
 if(f.id==="sf"){Object.assign(C,d,{interval:+d.interval,loader:!!f.loader.checked,showJournal:!!f.showJournal.checked,showTests:!!f.showTests.checked});await put("cfg",C);render()}
 drawAd();if(f.id==="sf"||f.id==="cof")alert("Saved")});

/* boot */
function render(){}
(async()=>{await fbInit();if(!fs){loginUI("Cannot connect to Firebase. Check your internet and reload.");return}
 const cf=(await ld("cfg")).find(x=>x.id==="main");C={...DEF,...(cf||{})};P=(await ld("projects")).sort((a,b)=>b.ts-a.ts);H=(await ld("hero")).sort((a,b)=>a.ts-b.ts);await openAd()})();
</script></body></html>
