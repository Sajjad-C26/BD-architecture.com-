<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Base Block Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0A;--fg:#F3F3F3;--mute:#8f8f8a;--line:#2b2b28;--gold:#C5A880;--scrim:rgba(10,10,10,.72);--serif:"Bodoni Moda","Didot","Times New Roman",serif;--sans:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;box-sizing:border-box}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F3F3F3;--fg:#0A0A0A;--mute:#6b6b67;--line:#d2d2ce;--gold:#8f7249;--scrim:rgba(243,243,243,.75)}}
:root[data-theme="light"]{--bg:#F3F3F3;--fg:#0A0A0A;--mute:#6b6b67;--line:#d2d2ce;--gold:#8f7249;--scrim:rgba(243,243,243,.75)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:300 16px/1.65 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1;letter-spacing:-.01em}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;touch-action:pan-y}
main{position:relative;z-index:1;pointer-events:none}
main a,main button,main input,main select,main textarea,main label{pointer-events:auto}
#back{position:fixed;z-index:5;top:calc(14px + env(safe-area-inset-top,0px));left:16px;width:46px;height:46px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--scrim);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pg{min-height:100svh;padding:calc(92px + env(safe-area-inset-top,0px)) clamp(20px,6vw,80px) calc(48px + env(safe-area-inset-bottom,0px));animation:in 1.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(16px)}}
h2{font-size:clamp(46px,10vw,124px);margin-bottom:clamp(28px,5vw,56px)}
.mute{color:var(--mute);font-size:13px}
/* home */
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 clamp(20px,6vw,80px) 56px}
.hero h1{font-size:clamp(58px,15vw,190px);line-height:.92;margin-bottom:28px}
.hero p{max-width:46ch;margin:0;font-size:15px;color:var(--fg);opacity:.82}
.cats{list-style:none;margin:0;padding:0 clamp(20px,6vw,80px) calc(72px + env(safe-area-inset-bottom,0px))}
.cats li{border-top:1px solid var(--line)}
.cats a{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:28px 0}
.cats .n{font:400 clamp(34px,7vw,84px)/1 var(--serif);transition:color .6s,padding .6s}
.cats a:hover .n,.cats a:focus-visible .n{color:var(--gold);padding-left:14px}
.cats .d{font-size:13px;color:var(--mute);text-align:right}
/* projects */
.proj{border-top:1px solid var(--line)}
.proj button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:16px;width:100%;padding:26px 0;pointer-events:auto}
.proj button:focus-visible{outline:1px solid var(--gold)}
.proj .t{font:400 clamp(28px,5vw,60px)/1.05 var(--serif);transition:color .6s,padding .6s}
.proj button:hover .t,.proj.open .t{color:var(--gold);padding-left:12px}
.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .9s cubic-bezier(.2,.7,.2,1)}
.proj.open .panel{grid-template-rows:1fr}
.panel>div{overflow:hidden}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:28px;padding:6px 0 36px}
.cols h3{font-size:21px;margin-bottom:8px;color:var(--gold)}
.cols p{margin:0;opacity:.85;max-width:50ch}
/* lab */
.lab{display:flex;flex-direction:column}
.lab h2{margin-bottom:0}
.ctl{margin-top:auto;padding:22px;background:var(--scrim);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);max-width:560px;pointer-events:auto}
.lab .sp{flex:1;min-height:36vh}
fieldset{border:0;padding:0;margin:0 0 20px}
legend,label{font-size:12px;color:var(--mute);letter-spacing:.03em;padding:0}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.opts button{background:none;border:1px solid var(--line);color:var(--fg);font:inherit;font-size:13px;padding:10px 14px;cursor:pointer;min-height:44px}
.opts button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
input[type=range]{width:100%;accent-color:var(--gold);margin:8px 0 0}
/* philosophy */
.ph{display:grid;gap:44px;max-width:620px}
.ph h3{font-size:clamp(34px,6vw,60px);color:var(--gold);margin-bottom:10px}
.ph p{margin:0;opacity:.85;max-width:44ch}
/* form */
form{display:grid;grid-template-columns:1fr 1fr;gap:26px 32px;max-width:860px;padding:26px;background:var(--scrim);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
@media(max-width:700px){form{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:6px}.f.w{grid-column:1/-1}
input,select,textarea{background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);font:300 17px var(--sans);padding:10px 0;border-radius:0;min-height:44px}
select option{background:var(--bg)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold)}
.send{grid-column:1/-1;justify-self:start;background:var(--gold);color:#0A0A0A;border:0;font:500 14px var(--sans);padding:16px 32px;cursor:pointer;min-height:48px}
#msg{grid-column:1/-1;margin:0;font-size:13px;color:var(--gold)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<a id="back" href="#/" aria-label="Back to home" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 4 7 12l8 8"/></svg></a>
<main id="v"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const WA_NUMBER="8801XXXXXXXXX"; // studio WhatsApp number, country code first, no +
const $=s=>document.querySelector(s),v=$("#v");
const L=matchMedia("(prefers-color-scheme: light)").matches,still=matchMedia("(prefers-reduced-motion: reduce)").matches;
const GOLD=L?0x8f7249:0xC5A880;

/* ---------- 3D ---------- */
const r=new THREE.WebGLRenderer({canvas:$("#gl"),antialias:true,alpha:true});
r.setClearColor(0,0);r.shadowMap.enabled=true;r.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(38,1,.1,100);
const sun=new THREE.DirectionalLight(0xffffff,1.15);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:60});
sc.add(sun,new THREE.AmbientLight(0xffffff,L?.55:.3));
const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.ShadowMaterial({opacity:L?.2:.55}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;sc.add(floor);
const M=new THREE.MeshStandardMaterial({color:L?0xb9b6b0:0x7a7873,roughness:.9,metalness:0});
const AZ={a:45,e:38};
function place(){const a=AZ.a*Math.PI/180,e=AZ.e*Math.PI/180,d=26;sun.position.set(Math.cos(a)*Math.cos(e)*d,Math.sin(e)*d,Math.sin(a)*Math.cos(e)*d)}place();
const box=(g,w,h,d,x,y,z,ry=0)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M);m.position.set(x,y,z);m.rotation.y=ry;m.castShadow=m.receiveShadow=true;g.add(m);return m};
const S={
 home:g=>{box(g,2,9,2,-3.4,4.5,-.5);box(g,3,6.2,2.4,0,3.1,.6);box(g,4.2,3,2.2,3.8,1.5,-.2)},
 projects:g=>{[3,5,7,4.5,6].forEach((h,i)=>box(g,1.4,h,.5,(i-2)*2.3,h/2,-Math.abs(i-2)*.9,(i-2)*-.18))},
 lab:g=>{[[4,3],[3,3.5],[3.6,2.6],[2.4,3],[3,2]].forEach((d,i)=>box(g,d[0],1.2,d[1],[0,.6,-.5,.4,0][i],.6+i*1.45,[0,.2,-.3,.3,-.4][i]))},
 philosophy:g=>{const e=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(8,8,8)),new THREE.LineBasicMaterial({color:GOLD}));e.position.y=4;g.add(e);box(g,2.6,2.6,2.6,.8,1.3,-.6);box(g,.3,8,.3,-3.85,4,3.85)},
 commission:g=>{for(let i=0;i<14;i++){const a=i*.46;box(g,2.6,.35,1.1,Math.cos(a)*3.2,.2+i*.46,Math.sin(a)*3.2,-a)}}
};
let g=null,drag=false,lx=0,px=0;
function build(k){if(g)sc.remove(g);g=new THREE.Group();(S[k]||S.home)(g);g.position.y=-3;g.rotation.y=.5;sc.add(g)}
function size(){const w=innerWidth,h=innerHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.position.z=w/h<1?24:16;cam.position.y=5;cam.updateProjectionMatrix()}
addEventListener("resize",size);size();
const cv=$("#gl");
cv.onpointerdown=e=>{drag=true;lx=e.clientX;cv.setPointerCapture(e.pointerId)};
cv.onpointerup=cv.onpointercancel=()=>drag=false;
addEventListener("pointermove",e=>{px=e.clientX/innerWidth-.5;if(drag){g.rotation.y+=(e.clientX-lx)*.01;lx=e.clientX}});
(function loop(){if(g){if(!drag&&!still)g.rotation.y+=.0015;g.position.y+=(0-g.position.y)*.04}
 cam.position.x+=(px*3-cam.position.x)*.03;cam.lookAt(0,3.4,0);r.render(sc,cam);requestAnimationFrame(loop)})();

/* ---------- content ---------- */
const CATS=[["projects","Projects","Five built works"],["lab","Lab","Test material and sunlight"],["philosophy","Philosophy","Four guiding principles"],["commission","Commission","Start a private inquiry"]];
const P=[
 ["Concrete Veil House","Residential, Dhaka, 2024","The plan is cut into three bands, so private rooms sit behind a long public courtyard.","The deep south wall shades the house in summer. A north slot pulls cross-breeze through every floor.","Board-formed concrete, American walnut, brushed bronze"],
 ["Atrium Tower","Commercial, Singapore, 2023","A central void runs the full height, so every floor looks into one shared room.","Fins follow the sun path and cut west glare. The void draws hot air up and out.","Swiss Pearl panels, low-iron glass, stainless steel"],
 ["Hall of Silence","Cultural, Kyoto, 2022","One windowless hall is reached through a long, narrowing corridor.","A single skylight tracks the noon sun and moves a line of light across the floor.","Cast lime plaster, black oak, honed basalt"],
 ["Terra Pavilion","Cultural, Lisbon, 2021","Four rammed-earth walls leave an open center that becomes the exhibition floor.","Thick walls hold the night's cool. A low sun enters only in winter.","Rammed earth, cork, weathering steel"],
 ["Linear Residence","Residential, Oslo, 2020","One long volume, one room deep, so every space meets the landscape on both sides.","Overhangs are sized for the Nordic sun angle. Triple glazing keeps winter heat in.","Pine CLT, standing-seam zinc, poured concrete"]
];
const PAGES={
 home:()=>`<section class="hero"><h1>Base Block<br>Studio</h1><p>Browse built work, test materials and sunlight on a live 3D model, read the thinking behind each space, and send a private inquiry for your own project. Everything is made to feel calm, clear and easy to use on any phone.</p></section><ul class="cats">${CATS.map(c=>`<li><a href="#/${c[0]}"><span class="n">${c[1]}</span><span class="d">${c[2]}</span></a></li>`).join("")}</ul>`,
 projects:()=>`<div class="pg"><h2>Projects</h2><div>${P.map((p,i)=>`<div class="proj"><button aria-expanded="false" aria-controls="p${i}"><span class="t">${p[0]}</span><span class="mute">${p[1]}</span></button><div class="panel" id="p${i}"><div><div class="cols"><div><h3>Spatial logic</h3><p>${p[2]}</p></div><div><h3>Environment</h3><p>${p[3]}</p></div><div><h3>Materials</h3><p>${p[4]}</p></div></div></div></div></div>`).join("")}</div></div>`,
 lab:()=>`<div class="pg lab"><h2>Lab</h2><div class="sp"></div><div class="ctl"><fieldset><legend>Material</legend><div class="opts" id="mat"></div></fieldset><fieldset><legend>Light tone</legend><div class="opts" id="tone"></div></fieldset><fieldset><label for="az">Sun direction</label><input id="az" type="range" min="0" max="360" value="${AZ.a}"></fieldset><fieldset style="margin:0"><label for="el">Sun height</label><input id="el" type="range" min="8" max="85" value="${AZ.e}"></fieldset></div></div>`,
 philosophy:()=>`<div class="pg"><h2>Philosophy</h2><div class="ph"><div><h3>Volume</h3><p>Space is the first material. We shape the volume before the surface, so the form carries the idea.</p></div><div><h3>Void</h3><p>What is left empty weighs as much as what is built. Voids give a building its pause, depth and scale.</p></div><div><h3>Light</h3><p>Light moves through the day and the year. We set each opening so every hour changes the room.</p></div><div><h3>Honest material</h3><p>Concrete, timber and metal show what they are. We never disguise one material as another.</p></div></div></div>`,
 commission:()=>`<div class="pg"><h2>Commission</h2><form id="f"><div class="f"><label for="n">Name</label><input id="n" required autocomplete="name"></div><div class="f"><label for="e">Email</label><input id="e" type="email" required autocomplete="email"></div><div class="f"><label for="loc">Site location</label><input id="loc" required></div><div class="f"><label for="gfa">Gross floor area (m²)</label><input id="gfa" type="number" min="0" inputmode="numeric"></div><div class="f"><label for="bud">Capital allocation</label><select id="bud"><option>Under USD 500K</option><option>USD 500K to 2M</option><option>USD 2M to 10M</option><option>Above USD 10M</option></select></div><div class="f"><label for="typ">Typology</label><select id="typ"><option>Residential Monolith</option><option>Commercial Tower</option><option>Cultural Institution</option></select></div><div class="f w"><label for="b">Brief</label><textarea id="b" rows="3"></textarea></div><button class="send" type="submit">Send inquiry</button><p id="msg" role="status"></p></form></div>`
};
const INIT={
 projects:()=>document.querySelectorAll(".proj button").forEach(b=>b.onclick=()=>{const o=b.parentElement.classList.toggle("open");b.setAttribute("aria-expanded",o)}),
 lab:()=>{
  const MATS={Concrete:[L?0xb9b6b0:0x7a7873,.9,0],Walnut:[0x5a3b25,.55,0],Titanium:[0x9a9ca0,.38,.4]},TONES={Warm:0xffd9a8,Neutral:0xffffff,Cool:0xbcd4ff};
  const mk=(id,o,fn)=>{const el=$("#"+id);Object.keys(o).forEach((k,i)=>{const b=document.createElement("button");b.type="button";b.textContent=k;b.setAttribute("aria-pressed",i==0);b.onclick=()=>{el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));fn(o[k])};el.appendChild(b)})};
  mk("mat",MATS,m=>{M.color.setHex(m[0]);M.roughness=m[1];M.metalness=m[2]});
  mk("tone",TONES,t=>sun.color.setHex(t));
  $("#az").oninput=e=>{AZ.a=+e.target.value;place()};$("#el").oninput=e=>{AZ.e=+e.target.value;place()};
 },
 commission:()=>$("#f").onsubmit=e=>{e.preventDefault();const x=id=>$("#"+id).value.trim();
  const t=`Commission inquiry%0AName: ${x("n")}%0AEmail: ${x("e")}%0ASite: ${x("loc")}%0AGFA: ${x("gfa")} m²%0ABudget: ${x("bud")}%0ATypology: ${x("typ")}%0ABrief: ${x("b")}`;
  $("#msg").textContent="Opening WhatsApp with your inquiry. Press send there to finish.";
  window.open(`https://wa.me/${WA_NUMBER}?text=${t}`,"_blank")}
};
function route(){const k=location.hash.replace(/^#\/?/,"")||"home",key=PAGES[k]?k:"home";
 v.innerHTML=PAGES[key]();build(key);$("#back").hidden=key=="home";scrollTo(0,0);INIT[key]&&INIT[key]();
 document.title=key=="home"?"Base Block Studio":CATS.find(c=>c[0]==key)[1]+" | Base Block Studio"}
addEventListener("hashchange",route);route();
</script>
</body>
</html>

</body></html>
